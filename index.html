<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F2421" />
    <!--app-head-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <script>
      // Always open in the arcade; fall back to classic only without WebGL (mirrors src/mode.ts).
      ;(function () {
        var d = document.documentElement, gl = false
        try { gl = !!document.createElement('canvas').getContext('webgl2') } catch (e) {}
        d.dataset.mode = gl ? 'arcade' : 'classic'
        if (!gl) d.dataset.auto = '1'
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
